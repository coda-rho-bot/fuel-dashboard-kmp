# Repos are private on Forgejo — the server-side netrc injection does not
# work with this setup, so clone auth is provided explicitly via the
# global Woodpecker secret FORGE_CLONE_TOKEN.
clone:
  git:
    image: woodpeckerci/plugin-git
    environment:
      CI_NETRC_MACHINE: git.angussoftware.dev
      CI_NETRC_USERNAME: coda
      CI_NETRC_PASSWORD:
        from_secret: FORGE_CLONE_TOKEN

when:
  # Feature branches are validated by the pull_request pipeline — skipping
  # the push event there halves concurrency and avoids two pipelines
  # contending for the shared Gradle cache lock (journal-1), which
  # serially fails one of them with "Timeout waiting to lock".
  - event: push
    branch: [main, master]
  - event: pull_request
    branch: [main, master, feature/*]

steps:
  build:
    image: localhost:5000/ci-theming:latest
    commands:
      - mkdir -p ~/.gradle
      - echo "forgejo.token=${FORGEJO_TOKEN}" >> ~/.gradle/gradle.properties
      - mkdir -p /tmp/android-sdk
      - echo "sdk.dir=/tmp/android-sdk" > local.properties
      - chmod +x gradlew
      - ./gradlew --no-daemon :composeApp:compileKotlinDesktop :composeApp:desktopTest
    environment:
      GRADLE_USER_HOME: /root/.gradle
    volumes:
      - gradle-cache-fuel-dashboard:/root/.gradle/caches
      - gradle-wrapper-fuel-dashboard:/root/.gradle/wrapper

  fetch-ci-scripts:
    # Plugin step (settings, no commands) — filtered secrets are only
    # allowed in plugins. Clones the private ci-scripts repo into the
    # shared workspace using the same netrc injection as the clone step.
    image: woodpeckerci/plugin-git
    settings:
      remote: https://git.angussoftware.dev/coda/ci-scripts.git
      path: ci-scripts
      depth: 1
    environment:
      CI_NETRC_MACHINE: git.angussoftware.dev
      CI_NETRC_USERNAME: coda
      CI_NETRC_PASSWORD:
        from_secret: FORGE_CLONE_TOKEN

  commitlint:
    image: alpine:latest
    when:
      event: pull_request
    commands:
      - apk add --no-cache git bash
      - bash ci-scripts/scripts/validate-commits.sh "origin/main...HEAD"

  auto-tag:
    image: alpine:latest
    when:
      event: push
      branch: [main, master]
    commands:
      - apk add --no-cache git bash curl
      - git fetch --tags "https://x-access-token:${GPR_TOKEN}@github.com/RhoMancer/fuel-dashboard-kmp.git" 2>&1 || true
      - REPO=RhoMancer/fuel-dashboard-kmp sh ci-scripts/scripts/auto-tag.sh
