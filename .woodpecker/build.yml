# Repos are private on Forgejo — server-side netrc injection does not work
# with this setup, so clone auth is explicit: CI_NETRC_* env in the clone
# step, sourced from the repo-level FORGE_CLONE_TOKEN secret. CI helper
# scripts are vendored into scripts/ci/ (cross-repo clones can't auth).
clone:
  git:
    image: woodpeckerci/plugin-git
    environment:
      CI_NETRC_MACHINE: git.angussoftware.dev
      CI_NETRC_USERNAME: coda
      CI_NETRC_PASSWORD:
        from_secret: FORGE_CLONE_TOKEN

when:
  # Feature branches are validated by the pull_request pipeline — skipping
  # the push event there halves concurrency and avoids two pipelines
  # contending for the shared Gradle cache lock (journal-1), which
  # serially fails one of them with "Timeout waiting to lock".
  - event: push
    branch: [main, master]
  - event: pull_request
    branch: [main, master, feature/*]

steps:
  build:
    image: localhost:5000/ci-theming:latest
    commands:
      - mkdir -p ~/.gradle
      - echo "forgejo.token=${FORGEJO_TOKEN}" >> ~/.gradle/gradle.properties
      - mkdir -p /tmp/android-sdk
      - echo "sdk.dir=/tmp/android-sdk" > local.properties
      - chmod +x gradlew
      - ./gradlew --no-daemon :composeApp:compileKotlinDesktop :composeApp:desktopTest
    environment:
      GRADLE_USER_HOME: /root/.gradle
    volumes:
      - gradle-cache-fuel-dashboard:/root/.gradle/caches
      - gradle-wrapper-fuel-dashboard:/root/.gradle/wrapper

  commitlint:
    image: alpine:latest
    when:
      event: pull_request
    commands:
      - apk add --no-cache git bash
      - bash scripts/ci/validate-commits.sh "origin/main...HEAD"

  auto-tag:
    image: alpine:latest
    when:
      event: push
      branch: [main, master]
    commands:
      - apk add --no-cache git bash curl
      - git fetch --tags "https://x-access-token:${GPR_TOKEN}@github.com/RhoMancer/fuel-dashboard-kmp.git" 2>&1 || true
      - REPO=RhoMancer/fuel-dashboard-kmp sh scripts/ci/auto-tag.sh
