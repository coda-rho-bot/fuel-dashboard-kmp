# Repos are private on Forgejo — server-side netrc injection does not work
# with this setup, so clone auth is explicit: CI_NETRC_* env in the clone
# step, sourced from the repo-level FORGE_CLONE_TOKEN secret. CI helper
# scripts are vendored into scripts/ci/ (cross-repo clones can't auth).
clone:
  git:
    image: woodpeckerci/plugin-git
    environment:
      CI_NETRC_MACHINE: git.angussoftware.dev
      CI_NETRC_USERNAME: coda
      CI_NETRC_PASSWORD:
        from_secret: FORGE_CLONE_TOKEN

when:
  # Feature branches are validated by the pull_request pipeline — skipping
  # the push event there halves concurrency and avoids two pipelines
  # contending for the shared Gradle cache lock (journal-1), which
  # serially fails one of them with "Timeout waiting to lock".
  - event: push
    branch: [main, master]
  - event: pull_request
    branch: [main, master, feature/*]

steps:
  build:
    image: localhost:5000/ci-theming:latest
    commands:
      # libskiko.so (Compose Desktop UI tests) links libGL + libX11 — absent
      # from the base image, the native lib dies with ExceptionInInitializerError
      - apt-get update -qq >/dev/null && apt-get install -y -qq libgl1 libx11-6 python3 >/dev/null
      - mkdir -p ~/.gradle
      # Leak-proof pattern (post-#287, fleet-shared/knowledge/step-log-secret-exposure.md):
      # Woodpecker's script-generator wrapper echoes expanded command text
      # regardless of set +x brackets, so the token is NEVER referenced in
      # shell command text. It rides via step-level from_secret env and is
      # consumed ONLY inside this Node script via process.env (ci-theming
      # ships Node 22 and no python3 — hence the Node writer).
      - |
        cat > /tmp/write-gradle-props.mjs << 'NODEEOF'
        import { appendFileSync, chmodSync, existsSync, mkdirSync } from 'node:fs'
        import { join } from 'node:path'
        import { homedir } from 'node:os'
        const TOKEN = process.env.FORGEJO_TOKEN
        if (!TOKEN) {
          console.error('FATAL: missing required env: FORGEJO_TOKEN')
          process.exit(1)
        }
        const gradleDir = process.env.GRADLE_USER_HOME || join(homedir(), '.gradle')
        mkdirSync(gradleDir, { recursive: true })
        const path = join(gradleDir, 'gradle.properties')
        if (!existsSync(path)) {
          appendFileSync(path, 'forgejo.token=' + TOKEN + '\n')
          chmodSync(path, 0o600)
        }
        console.log('gradle.properties written (1 credential, value not logged)')
        NODEEOF
        node /tmp/write-gradle-props.mjs
      - mkdir -p /tmp/android-sdk
      - echo "sdk.dir=/tmp/android-sdk" > local.properties
      - chmod +x gradlew
      - ./gradlew --no-daemon :composeApp:compileKotlinDesktop :composeApp:desktopTest
    environment:
      GRADLE_USER_HOME: /root/.gradle
      FORGEJO_TOKEN:
        from_secret: FORGEJO_TOKEN
    volumes:
      - gradle-cache-fuel-dashboard:/root/.gradle/caches
      - gradle-wrapper-fuel-dashboard:/root/.gradle/wrapper

  commitlint:
    image: alpine:latest
    when:
      event: pull_request
    commands:
      - apk add --no-cache git bash
      - bash scripts/ci/validate-commits.sh "origin/main...HEAD"

  auto-tag:
    image: alpine:latest
    when:
      event: push
      branch: [main, master]
    commands:
      - apk add --no-cache git bash curl python3
      # Leak-proof (post-#287): GPR_TOKEN consumed ONLY via os.environ — the
      # old x-access-token:${GPR_TOKEN} URL form expanded the secret in
      # command text, which the wrapper echoes to logs regardless of set +x.
      # The token is OPTIONAL (graceful skip when absent/dead — same
      # semantics as angus-tasks PR #84); fetch failures are non-fatal.
      - |
        cat > /tmp/fetch-tags.py << 'PYEOF'
        import os, subprocess, sys
        token = os.environ.get('GPR_TOKEN', '')
        if not token:
            print('GitHub tag fetch skipped (no token)')
            sys.exit(0)
        url = f'https://x-access-token:{token}@github.com/RhoMancer/fuel-dashboard-kmp.git'
        r = subprocess.run(['git', 'fetch', '--tags', url], capture_output=True, text=True)
        if r.returncode != 0:
            print(f'GitHub tag fetch failed (non-fatal): {r.stderr.strip()[:200]}')
        else:
            print('GitHub tags fetched')
        PYEOF
        python3 /tmp/fetch-tags.py
      - REPO=RhoMancer/fuel-dashboard-kmp sh scripts/ci/auto-tag.sh
    environment:
      GPR_TOKEN:
        from_secret: gpr_token
