when:
  - event: [push, pull_request]
    branch: [main, master, feature/*]

steps:
  build:
    image: localhost:5000/ci-theming:latest
    commands:
      # Configure Forgejo Maven credentials for angus-gradle-tools plugin
      - |
        mkdir -p ~/.gradle
        source /ci-env 2>/dev/null || true
        if [ -n "$FORGEJO_TOKEN" ]; then
          echo "forgejo.token=${FORGEJO_TOKEN}" >> ~/.gradle/gradle.properties
        fi
      - chmod +x gradlew
      # Compile desktop target — verifies KMP + Compose + all dependencies resolve
      - ./gradlew --no-daemon :composeApp:compileKotlinDesktop
    environment:
      GRADLE_USER_HOME: /root/.gradle
    volumes:
      - gradle-cache-fuel-dashboard:/root/.gradle/caches
      - gradle-wrapper-fuel-dashboard:/root/.gradle/wrapper
